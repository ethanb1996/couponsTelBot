<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{{.Title}}</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 2rem auto; max-width: 880px; line-height: 1.5; color: #1f2937; }
    nav a { margin-right: 1rem; }
    .card { border: 1px solid #d1d5db; border-radius: 8px; padding: 1rem; margin-top: 1rem; }
    .field { margin-bottom: .75rem; }
    label { display: block; font-weight: 600; margin-bottom: .25rem; }
    input, textarea, select { width: 100%; box-sizing: border-box; padding: .5rem; }
    textarea { min-height: 100px; }
    .notice { padding: .75rem 1rem; border-radius: 8px; margin: 1rem 0; }
    .error { background: #fef2f2; color: #991b1b; }
    .success { background: #ecfdf5; color: #065f46; }
  </style>
</head>
<body>
  <nav>
    <a href="/admin/">Dashboard</a>
    <a href="/admin/sources">Sources</a>
    <a href="/admin/listings">Listings</a>
    <a href="/admin/coupons">Coupons</a>
    <a href="/admin/orders">Orders</a>
    <a href="/admin/support">Support</a>
  </nav>

  <h1>{{.Title}}</h1>
  {{if .ErrorMessage}}<div class="notice error">{{.ErrorMessage}}</div>{{end}}
  {{if .SuccessMessage}}<div class="notice success">{{.SuccessMessage}}</div>{{end}}

  <div class="card">
    <form method="post">
      <div class="field">
        <label for="source_name">Source Name</label>
        <input id="source_name" name="source_name" value="{{.Source.SourceName}}" required>
      </div>
      <div class="field">
        <label for="source_type">Source Type</label>
        <select id="source_type" name="source_type">
          {{range .SourceTypes}}<option value="{{.}}" {{if eq $.Source.SourceType .}}selected{{end}}>{{.}}</option>{{end}}
        </select>
      </div>
      <div class="field">
        <label for="contact_reference">Contact Reference</label>
        <input id="contact_reference" name="contact_reference" value="{{.Source.ContactReference}}">
      </div>
      <div class="field">
        <label for="rights_status">Rights Status</label>
        <select id="rights_status" name="rights_status">
          {{range .RightsStatuses}}<option value="{{.}}" {{if eq $.Source.RightsStatus .}}selected{{end}}>{{.}}</option>{{end}}
        </select>
      </div>
      <div class="field">
        <label for="risk_rating">Risk Rating</label>
        <select id="risk_rating" name="risk_rating">
          {{range .RiskRatings}}<option value="{{.}}" {{if eq $.Source.RiskRating .}}selected{{end}}>{{.}}</option>{{end}}
        </select>
      </div>
      <div class="field">
        <label for="verification_notes">Verification Notes</label>
        <textarea id="verification_notes" name="verification_notes">{{.Source.VerificationNotes}}</textarea>
      </div>
      <div class="field">
        <label><input type="checkbox" name="is_active" {{if .Source.IsActive}}checked{{end}}> Active source</label>
      </div>
      <button type="submit">Save Source</button>
    </form>
  </div>
</body>
</html>
